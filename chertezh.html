е А слой песка растёт до 0,78.</text><text x="235" y="178" class="t" font-size="2.7" text-anchor="start">5. Канавы вдоль сторон А и Б: 0,70 по верху от края дороги,</text><text x="239.5" y="183" class="t" font-size="2.7" text-anchor="start">берма 0,30 у границы, дно с уклоном 0,020 к т.1 (угол 1).</text><text x="235" y="188" class="t" font-size="2.7" text-anchor="start">6. Глубина 1,00 от покрытия дороги — в мелком конце (угол 4).</text><text x="239.5" y="193" class="t" font-size="2.7" text-anchor="start">Рекомендуется 1,20: иначе у угла 4 дно выше низа щебня.</text><text x="235" y="198" class="t" font-size="2.7" text-anchor="start">7. Откосы канав круче 1:1 — нужно крепление (геотекстиль +</text><text x="239.5" y="203" class="t" font-size="2.7" text-anchor="start">щебень, габионы или ж/б лоток).</text><text x="235" y="208" class="t" font-size="2.7" text-anchor="start">8. Сброс воды из т.1 (колодец, труба, кювет) — по месту,</text><text x="239.5" y="213" class="t" font-size="2.7" text-anchor="start">в задании не определён.</text><text x="235" y="218" class="t" font-size="2.7" text-anchor="start">9. Слои отсыпать с послойным уплотнением.</text><text x="235" y="223" class="t" font-size="2.7" text-anchor="start">10. Ширина автодороги на чертеже условная.</text></svg></div></figure>
