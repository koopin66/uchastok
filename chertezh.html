"/><line x1="34" y1="136" x2="34" y2="184" class="th"/><line x1="126" y1="136" x2="126" y2="184" class="th"/><line x1="138" y1="136" x2="138" y2="184" class="th"/><line x1="164" y1="136" x2="164" y2="184" class="th"/><line x1="190" y1="136" x2="190" y2="184" class="th"/><text x="25" y="191" class="t" font-size="2.5" text-anchor="start">К заказу = в деле × коэффициент уплотнения (щебень 1,3, песок 1,2).</text><text x="25" y="195.5" class="t" font-size="2.5" text-anchor="start">Насыпная плотность: 40×70 — 1,45, 20×40 — 1,40, песок — 1,50 т/м³. Уточнить у поставщика.</text><text x="235" y="132" class="t" font-size="4" text-anchor="start" font-weight="700">Примечания</text><text x="235" y="138" class="t" font-size="2.7" text-anchor="start">1. Отметки и размеры в метрах. Условный 0,00 — покрытие</text><text x="239.5" y="143" class="t" font-size="2.7" text-anchor="start">автодороги. Участок исходно ниже дороги на 0,60.</text><text x="235" y="148" class="t" font-size="2.7" text-anchor="start">2. Площадь по размерам 31,00 × 19,00 = 589 м² (не 600 м²).</text><text x="235" y="153" class="t" font-size="2.7" text-anchor="start">3. Плодородный слой снимается на 0,10 у стороны С; основание</text><text x="239.5" y="158" class="t" font-size="2.7" text-anchor="start">планируется с уклоном 0,020 к стороне А (у А выемка 0,48).</text><text x="235" y="163" class="t" font-size="2.7" text-anchor="start">4. Подъём до 0,00: 0,60 + 0,10 = 0,70 = 0,20 + 0,10 + 0,40</text><text x="239.5" y="168" class="t" font-size="2.7" text-anchor="start">(на стороне С). К стороне А слой песка растёт до 0,78.</text><text x="235" y="173" class="t" font-size="2.7" text-anchor="start">5. Канавы вдоль сторон А и Б: 0,70 по верху от края дороги,</text><text x="239.5" y="178" class="t" font-size="2.7" text-anchor="start">берма 0,30 у границы, дно с уклоном 0,020 к т.1 (угол 1).</text><text x="235" y="183" class="t" font-size="2.7" text-anchor="start">6. Глубина 1,00 от покрытия дороги — в мелком конце (угол 4).</text><text x="239.5" y="188" class="t" font-size="2.7" text-anchor="start">Рекомендуется 1,20: иначе у угла 4 дно выше низа щебня.</text><text x="235" y="193" class="t" font-size="2.7" text-anchor="start">7. Откосы канав круче 1:1 — нужно крепление (геотекстиль +</text><text x="239.5" y="198" class="t" font-size="2.7" text-anchor="start">щебень, габионы или ж/б лоток).</text><text x="235" y="203" class="t" font-size="2.7" text-anchor="start">8. Сброс воды из т.1 (колодец, труба, кювет) — по месту,</text><text x="239.5" y="208" class="t" font-size="2.7" text-anchor="start">в задании не определён.</text><text x="235" y="213" class="t" font-size="2.7" text-anchor="start">9. Слои отсыпать с послойным уплотнением.</text><text x="235" y="218" class="t" font-size="2.7" text-anchor="start">10. Ширина автодороги на чертеже условная.</text></svg></div></figure>
